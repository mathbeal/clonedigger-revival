# The original release, the files the tests read and the changelog (git-cliff) stay
# byte for byte as they are.
exclude: ^(legacy/|tests/golden/|tests/data/|CHANGELOG\.md$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  # Every tool runs as CI and the justfile run it: ruff from the lockfile, typos,
  # zizmor, pydoclint, lexdrift and reuse through uvx. Two versions of a tool give two
  # verdicts.
  - repo: local
    hooks:
      # Through just, which keeps the virtual environment out of iCloud Drive.
      - id: ruff
        name: ruff check and format (lint, imports, bandit)
        entry: just ruff-hook
        language: system
        types: [python]
        require_serial: true
      - id: lexdrift
        name: lexdrift
        entry: uvx lexdrift check src
        language: system
        types: [python]
        pass_filenames: false
      - id: typos
        name: typos
        entry: uvx typos .
        language: system
        pass_filenames: false
      - id: pydoclint
        name: pydoclint (docstrings match signatures)
        entry: uvx pydoclint==0.10.1 src
        language: system
        files: ^src/.*\.py$
        pass_filenames: false
      # A test says what it checks in one line; a helper documents its arguments.
      - id: pydoclint-tests
        name: pydoclint (helpers of the tests)
        entry: uvx pydoclint==0.10.1 --skip-checking-short-docstrings=True --exclude 'golden|samples' tests
        language: system
        files: ^tests/.*\.py$
        pass_filenames: false
      - id: reuse
        name: reuse lint (copyright and licence of every file)
        entry: uvx --from reuse[charset-normalizer]==6.2.0 reuse lint
        language: system
        pass_filenames: false
      - id: zizmor
        name: zizmor
        entry: uvx zizmor --persona=regular .github/workflows/
        language: system
        files: ^\.github/workflows/
        pass_filenames: false
