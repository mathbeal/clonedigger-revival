name: publish

# A tag starting with v triggers a release; the version it publishes comes from
# pyproject.toml, not from the tag (checked below, so the two cannot disagree).
on:
  push:
    tags: ["v*"]

permissions: {}

# A second tag pushed while a release is running waits for this one: never two releases
# of the same tag pattern at once.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  UV_FROZEN: "1"

jobs:
  build:
    name: build and check, from the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: the tag must match the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="${TAG#v}"
          found="$(uv run --no-project python -c 'import re,pathlib; print(re.search(r"(?m)^version = \"([^\"]+)\"", pathlib.Path("pyproject.toml").read_text()).group(1))')"
          echo "tag=$expected  version=$found"
          test "$expected" = "$found"

      # Every date inside the files is the tagged commit's: anyone can rebuild them from
      # the tag and get the same bytes (SECURITY.md, "the build is reproducible"). A
      # second build checks it before anything is uploaded.
      - name: build, twice, from the tagged commit
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          uv build -o dist
          uv build --quiet -o "$RUNNER_TEMP/again"
          (cd dist && sha256sum -- *) | tee "$RUNNER_TEMP/dist.sha256"
          (cd "$RUNNER_TEMP/again" && sha256sum --check --strict -- "$RUNNER_TEMP/dist.sha256")
      - run: uv run --no-project --with twine twine check --strict dist/*

      - name: write the CycloneDX SBOM of the installed wheel
        run: |
          venv="$(mktemp -d)/venv"
          uv venv --no-project -q "$venv"
          uv pip install --python "$venv" --quiet dist/*.whl
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            uvx --from cyclonedx-bom cyclonedx-py environment --pyproject pyproject.toml \
              --output-reproducible -o sbom.cdx.json "$venv"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted publishing: PyPI trusts this environment's OIDC token, no API token
    # stored anywhere. The pypi environment requires mathbeal's approval before this job
    # runs (GitHub repository Settings, Environments: set up by hand, since creating a
    # protected environment needs admin rights that mathbealbot does not have).
    environment:
      name: pypi
      url: https://pypi.org/p/clonedigger-revival
    permissions:
      id-token: write  # for PyPI trusted publishing (OIDC): no API token is stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      # Publishes with the OIDC token above (trusted publishing) and attaches a PEP 740
      # attestation to each file, signed the same way: no step here holds a secret.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
