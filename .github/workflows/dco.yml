name: dco

# Every commit of a pull request certifies the Developer Certificate of Origin
# with a Signed-off-by line (git commit -s). See CONTRIBUTING.md.
on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sign-off:
    name: every commit is signed off
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: look for Signed-off-by in each commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          # Computed first: if git fails, the job fails instead of checking nothing.
          commits=$(git rev-list --no-merges "$BASE..$HEAD")
          missing=0
          for commit in $commits; do
            if ! git log -1 --format=%B "$commit" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $commit has no Signed-off-by line. Add it with: git commit --amend -s (or git rebase --signoff)."
              missing=1
            fi
          done
          exit "$missing"
