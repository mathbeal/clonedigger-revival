name: mutation

# Slow: once a week, and on demand. Every mutant must be caught.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

env:
  UV_FROZEN: "1"

jobs:
  mutmut:
    name: every mutant is caught
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv run mutmut run
      - name: no mutant survives
        run: |
          uv run mutmut results
          test -z "$(uv run mutmut results | grep survived)"
