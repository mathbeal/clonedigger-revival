name: fuzz

# Every Hypothesis property with 50,000 examples instead of 100. Once a week while the
# repository is private, where every minute of CI counts. A failure prints the smallest
# input that breaks the property: `just fuzz` reproduces it, and it becomes a test.
on:
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions: {}

# One run at a time: a manual run waits for the scheduled one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  UV_FROZEN: "1"

jobs:
  fuzz:
    name: every property holds on 50,000 examples
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv run pytest -o addopts="" -p no:cacheprovider -q --hypothesis-profile=fuzz
        env:
          CLONEDIGGER_FUZZ_EXAMPLES: "50000"
