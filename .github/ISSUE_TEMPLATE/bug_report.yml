name: Bug report
description: A clone is missed or wrongly reported, a file cannot be read, or the command fails.
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Paste only code you may share: this issue is public. A security problem?
        Report it privately instead — see
        [SECURITY.md](https://github.com/mathbeal/clonedigger-revival/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, and what it printed.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: The clone you expected, or not to see, with the two pieces of code if you can.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `clonedigger --version`.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python
      description: The output of `python --version`, of the Python that runs clonedigger.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26, Windows 11, Ubuntu 24.04…
