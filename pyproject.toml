[project]
name = "clonedigger-revival"
version = "0.0.1.dev0"
description = "Clone Digger by Peter Bulychev, ported to Python 3: duplicate code detection by anti-unification"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.12"
authors = [{ name = "Peter Bulychev", email = "peter.bulychev@gmail.com" }]
maintainers = [{ name = "Mathieu Béal", email = "mathieu.beal@protonmail.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
"Original project" = "http://clonedigger.sourceforge.net"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clonedigger"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/NOTICE.md", "/LICENSE", "/CITATION.cff"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy", "tests/golden"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # conflicts with the formatter
    "D203",    # one blank line before a class docstring: D211 is kept
    "D213",    # summary on the second line: D212 is kept
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
exclude = ["^legacy/", "^tests/golden/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
xfail_strict = true
addopts = "--strict-markers --strict-config --cov=clonedigger --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["src/clonedigger"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
