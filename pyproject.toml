[project]
name = "clonedigger-revival"
version = "0.0.1.dev0"
description = "Clone Digger by Peter Bulychev, ported to Python 3: duplicate code detection by anti-unification"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.12"
authors = [{ name = "Peter Bulychev", email = "peter.bulychev@gmail.com" }]
maintainers = [{ name = "Mathieu Béal", email = "mathieu.beal@protonmail.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
clonedigger = "clonedigger.cli:main"

[project.urls]
"Original project" = "http://clonedigger.sourceforge.net"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clonedigger"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/NOTICE.md", "/LICENSE", "/LICENSES", "/REUSE.toml", "/CITATION.cff"]

[tool.ruff]
line-length = 100
# Code written to be read by the tool, not by ruff: the original release, the inputs of
# the tests, and the example whose whole point is the duplication left in it.
extend-exclude = ["examples", "legacy", "tests/golden", "tests/samples"]

[tool.ruff.lint]
select = ["ALL"]
preview = true
ignore = ["COM812"]  # conflicts with the formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "INP001"]
# Scripts run on their own: one downloads pinned archives (checked by their SHA-256) and
# runs the three tools it compares, the other is driven by a reader at a terminal.
"benchmarks/**" = ["S310", "S404", "S603", "S607"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "benchmarks"]
exclude = ["^legacy/", "^tests/golden/", "^tests/samples/"]

# pre-commit ships no annotations, and reading .pre-commit-hooks.yaml against its own
# schema is the one thing the tests ask of it.
[[tool.mypy.overrides]]
module = ["pre_commit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The root on the path, so that the tests import the scripts of benchmarks/ by their
# full name, the one mutation testing knows them by.
pythonpath = ["."]
filterwarnings = ["error"]
xfail_strict = true
addopts = "--strict-markers --strict-config --cov=clonedigger --cov=benchmarks.label --cov=benchmarks.phases --cov=benchmarks.precision --cov-branch --cov-report=term-missing --cov-fail-under=100"

[dependency-groups]
dev = [
    "deptry==0.25.1",
    "hypothesis==6.168.5",
    "jsonschema==4.25.1",
    "mutmut==3.8.0",
    "mypy==2.4.0",
    # Its schema for .pre-commit-hooks.yaml, which the tests read that file against.
    "pre-commit==4.7.0",
    "pylint==4.0.9",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    # The example workflow of docs/github-code-scanning.md, read as Actions reads it.
    "pyyaml==6.0.3",
    "ruff==0.16.10",
    "types-jsonschema==4.26.0.20261006",
    "types-pyyaml==6.0.12.20260906",
    "vulture==2.14",
]

[tool.pylint.format]
max-line-length = 100

# A suppression that silences nothing hides the next real finding at that line: refused.
[tool.pylint."messages control"]
enable = ["useless-suppression"]

[tool.pylint.main]
fail-on = ["useless-suppression"]
ignore-paths = ["^legacy/.*$", "^tests/golden/.*$", "^tests/samples/.*$"]

# Code that nothing calls. Names used only from outside (the public API, dunder
# methods) are listed in vulture_whitelist.py, each with the reason.
[tool.vulture]
paths = ["src", "vulture_whitelist.py"]
min_confidence = 60
sort_by_size = true

[tool.deptry]
known_first_party = ["clonedigger"]

# Mutation testing: change the code a little, one way at a time, and check that some
# test fails. A mutant that survives is a behaviour no test pins down.
[tool.mutmut]
source_paths = [
    "src/clonedigger/",
    "benchmarks/label.py",
    "benchmarks/phases.py",
    "benchmarks/precision.py",
]
do_not_mutate = ["src/clonedigger/__init__.py"]
also_copy = [
    "tests/golden/",
    "docs/",
    "examples/",
    "benchmarks/sample.json",
    "benchmarks/labels.jsonl",
]
pytest_add_cli_args = ["--no-cov", "-p", "no:cacheprovider"]

[tool.lexdrift.nouns]

# What ruff's docstring rules do not check: arguments in the signature's order, no type
# in a docstring (the annotation is the only one), summary-only docstrings checked too.
# Run with `uvx` (just lint), as in avenir-mcp.
[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
skip-checking-raises = true
check-class-attributes = true
allow-init-docstring = true
skip-checking-short-docstrings = false
