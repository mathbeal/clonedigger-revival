# Links checked by `just links` and the links workflow: every link of the Markdown files
# at the root of the repository.
scheme = ["https", "http"]
retry_wait_time = 5
timeout = 30
max_concurrency = 8
cache = true
# A site that refuses robots (403) or asks to slow down (429) is up.
accept = ["200..=299", "403", "429"]
